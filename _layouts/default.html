<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    {%- feed_meta -%}
    <title>{{ page.title | default: site.title }}</title>
    <style>
        body {
            background: #000;
            color: #39FF14;
            font-family: 'Fira Mono', 'Consolas', 'Menlo', monospace;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        a, a:visited {
            color: #39FF14;
            text-decoration: underline;
            font-family: inherit;
            transition: text-shadow 0.3s;
        }
        a:hover, a:focus {
            text-shadow: 0 0 4px #39FF14, 0 0 12px #39FF14;
        }
        .terminal-container {
            margin-top: 3em;
            background: rgba(0,0,0,0.85);
            border: 2px solid #39FF14;
            border-radius: 10px;
            box-shadow: 0 0 24px #39FF1433;
            padding: 2em 2.5em;
            width: 100%;
            max-width: 700px;
        }
        @media (max-width: 800px) {
            .terminal-container { max-width: 98vw; padding: 1em; }
        }
    </style>
    <!-- Placeholder for future Matrix Rain animation -->
    <div id="matrix-rain-placeholder" style="display:none;"></div>
</head>
<body>
    <div class="terminal-container">
        {{ content }}
    </div>
</body>
</html>
