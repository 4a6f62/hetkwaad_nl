<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    {%- feed_meta -%}
    <title>{{ page.title | default: site.title }}</title>
    <style>
        body {
            background: #000;
            color: #39FF14;
            font-family: 'Fira Mono', 'Consolas', 'Menlo', monospace;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        a, a:visited {
            color: #39FF14;
            text-decoration: underline;
            font-family: inherit;
            transition: text-shadow 0.3s;
        }
        a:hover, a:focus {
            text-shadow: 0 0 4px #39FF14, 0 0 12px #39FF14;
        }
        .terminal-container {
            margin-top: 3em;
            background: rgba(0,0,0,0.85);
            border: 2px solid #39FF14;
            border-radius: 10px;
            box-shadow: 0 0 24px #39FF1433;
            padding: 2em 2.5em;
            width: 100%;
            max-width: 700px;
        }
        @media (max-width: 800px) {
            .terminal-container { max-width: 98vw; padding: 1em; }
        }
        .yt-facade-wrap {
            position: relative;
            width: 560px;
            max-width: 100%;
            aspect-ratio: 560 / 315;
            margin: 0 auto;
        }
        .yt-facade-wrap iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        .yt-facade-btn {
            width: 100%;
            height: 100%;
            background: #000;
            border: 2px solid #39FF14;
            border-radius: 6px;
            color: #39FF14;
            font-family: 'Fira Mono', 'Consolas', 'Menlo', monospace;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            text-align: center;
        }
        .yt-facade-btn:hover, .yt-facade-btn:focus-visible {
            box-shadow: 0 0 16px #39FF1466;
        }
        .yt-play-triangle {
            width: 0; height: 0;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 22px solid #39FF14;
        }
        .yt-facade-note { font-size: 12px; opacity: 0.75; max-width: 40ch; }
        .site-footer {
            margin: 2em 0 3em;
            font-family: 'Fira Mono', 'Consolas', 'Menlo', monospace;
            font-size: 13px;
            opacity: 0.85;
        }
        .site-footer a { color: #39FF14; }
    </style>
    <!-- Placeholder for future Matrix Rain animation -->
    <div id="matrix-rain-placeholder" style="display:none;"></div>
</head>
<body>
    <div class="terminal-container">
        {{ content }}
    </div>
    <div class="site-footer"><a href="{{ '/privacy.html' | relative_url }}">Privacy Policy</a></div>

    <script>
    // Click-to-load YouTube embeds: replace any YouTube iframe with a facade
    // button so nothing loads from YouTube (and no cookies are set) until the
    // visitor explicitly clicks. Applies automatically to every post page.
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('iframe[src*="youtube.com/embed"], iframe[src*="youtube-nocookie.com/embed"]').forEach(function (frame) {
            var src = frame.getAttribute('src');
            var title = frame.getAttribute('title') || 'YouTube video';
            var noCookieSrc = src.replace('www.youtube.com', 'www.youtube-nocookie.com').replace('://youtube.com', '://www.youtube-nocookie.com');

            var wrap = document.createElement('div');
            wrap.className = 'yt-facade-wrap';

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'yt-facade-btn';
            btn.setAttribute('aria-label', 'Load and play: ' + title);
            btn.innerHTML =
                '<span class="yt-play-triangle" aria-hidden="true"></span>' +
                '<span>Click to load video</span>' +
                '<span class="yt-facade-note">Loads a YouTube embed and may let YouTube set cookies. See the <a href="' + '{{ "/privacy.html" | relative_url }}' + '" style="color:inherit;text-decoration:underline;" onclick="event.stopPropagation()">privacy policy</a>.</span>';

            btn.addEventListener('click', function () {
                var iframe = document.createElement('iframe');
                iframe.src = noCookieSrc + (noCookieSrc.indexOf('?') > -1 ? '&' : '?') + 'autoplay=1';
                iframe.title = title;
                iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                iframe.setAttribute('allowfullscreen', '');
                wrap.innerHTML = '';
                wrap.appendChild(iframe);
            });

            wrap.appendChild(btn);
            frame.replaceWith(wrap);
        });
    });
    </script>
</body>
</html>
